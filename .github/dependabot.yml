# Dependabot — auto-PRs for outdated dependencies and stale GitHub Actions.
#
# We group ecosystem updates so we don't get one PR per dep; the maintainer
# can review the bundled diff in one pass. Major-version bumps are excluded
# from grouping because they often require manual changes.

version: 2
updates:
  # Workspaces root
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - npm
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch

  # TypeScript SDK
  - package-ecosystem: npm
    directory: "/packages/sdk-typescript"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - npm
      - sdk-typescript

  # CLI
  - package-ecosystem: npm
    directory: "/packages/cli"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - npm
      - cli

  # Python SDK
  - package-ecosystem: pip
    directory: "/packages/sdk-python"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - pip
      - sdk-python

  # GitHub Actions — pinned-by-SHA dependencies in workflows still get
  # offered upgrade PRs by Dependabot when the upstream cuts a new release.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - github-actions
