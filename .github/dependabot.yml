# Dependabot config.
#
# Policy:
# - Auto-PR only for minor + patch bumps. Major bumps require manual
#   review and are filtered out entirely (the `ignore` block below).
# - Group all minor + patch bumps in each ecosystem into a single PR
#   so we don't get one PR per dep on Monday morning.
# - Limit 3 open PRs per ecosystem to keep the inbox calm.
# - Weekly schedule (Monday 07:00 Sydney) so updates batch into one
#   review session rather than dribbling all week.
#
# When a major bump matters (security advisory, feature we want, etc),
# bump it manually. The github-action-pinned-by-SHA workflow change
# also makes major action bumps a deliberate decision rather than
# automatic.

version: 2
updates:
  # ── Workspaces root ─────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 3
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - npm
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      all-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # ── TypeScript SDK ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/packages/sdk-typescript"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 3
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - npm
      - sdk-typescript
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      all-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # ── CLI ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/packages/cli"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 3
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - npm
      - cli
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      all-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # ── Python SDK ──────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/packages/sdk-python"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 3
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - pip
      - sdk-python
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      all-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # ── GitHub Actions ──────────────────────────────────────────────
  # Workflow actions are pinned by commit SHA (see
  # .github/workflows/*.yml). Dependabot still offers PRs when the
  # upstream tags a new release; we only accept minor/patch here.
  # Major action bumps tend to introduce breaking inputs / runtime
  # changes and need a workflow review.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 3
    reviewers:
      - vineetnair
    labels:
      - dependencies
      - github-actions
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      all-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch
