name: Release CLI

# Builds standalone binaries for the `sb` CLI on every git tag of the form
# `cli-vX.Y.Z` and uploads them to a GitHub Release. Also publishes
# `@stablebaseline/cli` to npm using Trusted Publishing (OIDC) — no
# NPM_TOKEN secret required. Configure once at
# https://www.npmjs.com/package/@stablebaseline/cli/access (Trusted
# Publishers tab) binding this workflow to the package.
#
# Triggering a release:
#   git tag cli-v0.1.0
#   git push origin cli-v0.1.0

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. cli-v0.1.0)"
        required: true
        type: string

permissions: {}

jobs:
  # All four standalone binaries are cross-compiled on a SINGLE Linux runner.
  # Bun's `--compile --target=` cross-compiles to every OS/arch from one host
  # (https://bun.sh/docs/bundler/executables), so the old per-OS matrix is gone.
  # That matrix depended on the Intel `macos-13` runner, which is scarce and can
  # sit queued for many minutes — gating the whole release (npm publish included)
  # behind it. One ubuntu runner builds all targets in ~1-2 min.
  build:
    name: Build standalone binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Refresh OpenAPI spec from production
        run: npm run codegen:openapi

      # The standalone binaries (bun --compile, below) bundle @stablebaseline/sdk
      # from the workspace, so the SDK's dist/ must exist first. tsup only
      # externalizes the dependency, so "Build CLI" alone leaves the SDK unbuilt
      # and bun fails with "Could not resolve: @stablebaseline/sdk". codegen
      # needs the spec fetched in the step above.
      - name: Build SDK (bundled into the standalone binaries)
        working-directory: packages/sdk-typescript
        shell: bash
        run: |
          npm run codegen
          npm run build

      - name: Build CLI
        working-directory: packages/cli
        run: npm run build

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Cross-compile every target from this one Linux host. NOTE: bun's target
      # triples use "darwin" (not "macos"). Each binary is staged in its own dir
      # with README + LICENSE so the archive root stays clean.
      - name: Cross-compile binaries (all targets)
        working-directory: packages/cli
        shell: bash
        run: |
          set -euo pipefail
          build() {
            local triple="$1" dir="$2" bin="$3"
            echo "==> $triple -> stage/$dir/$bin"
            mkdir -p "stage/$dir"
            bun build --compile --target="$triple" --outfile="stage/$dir/$bin" ./src/bin/sb.ts
            cp README.md ../../LICENSE "stage/$dir/"
          }
          build bun-linux-x64    linux-x64   sb
          build bun-darwin-x64   macos-x64   sb
          build bun-darwin-arm64 macos-arm64 sb
          build bun-windows-x64  windows-x64 sb.exe

      - name: Archive
        working-directory: packages/cli/stage
        shell: bash
        run: |
          set -euo pipefail
          tar -czf ../sb-linux-x64.tar.gz   -C linux-x64   sb README.md LICENSE
          tar -czf ../sb-macos-x64.tar.gz   -C macos-x64   sb README.md LICENSE
          tar -czf ../sb-macos-arm64.tar.gz -C macos-arm64 sb README.md LICENSE
          ( cd windows-x64 && zip -q ../../sb-windows-x64.zip sb.exe README.md LICENSE )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sb-binaries
          path: |
            packages/cli/sb-*.tar.gz
            packages/cli/sb-*.zip

  release:
    name: GitHub Release + npm publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload binaries
      id-token: write   # OIDC for npm publish provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to a Trusted-Publishing-capable version
        run: npm install -g npm@latest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Install workspace deps
        run: npm ci

      - name: Publish (Trusted Publishing + provenance)
        working-directory: packages/cli
        run: npm publish --provenance --access public
