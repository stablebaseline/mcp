name: Release CLI

# Builds standalone binaries for the `sb` CLI on every git tag of the form
# `cli-vX.Y.Z` and uploads them to a GitHub Release. Also publishes
# `@stablebaseline/cli` to npm using Trusted Publishing (OIDC) — no
# NPM_TOKEN secret required. Configure once at
# https://www.npmjs.com/package/@stablebaseline/cli/access (Trusted
# Publishers tab) binding this workflow to the package.
#
# Triggering a release:
#   git tag cli-v0.1.0
#   git push origin cli-v0.1.0

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. cli-v0.1.0)"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
          - target: macos-x64
            runner: macos-13
            archive: tar.gz
          - target: macos-arm64
            runner: macos-latest
            archive: tar.gz
          - target: windows-x64
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build CLI
        working-directory: packages/cli
        run: npm run build

      - name: Compile single-file binary (Bun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Bun compile
        working-directory: packages/cli
        shell: bash
        run: |
          bun build --compile \
            --target=bun-${{ matrix.target }} \
            --outfile=sb${{ runner.os == 'Windows' && '.exe' || '' }} \
            ./src/bin/sb.ts

      - name: Archive
        working-directory: packages/cli
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a sb-${{ matrix.target }}.zip sb.exe README.md ../../LICENSE
          else
            tar -czf sb-${{ matrix.target }}.tar.gz sb README.md ../../LICENSE
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sb-${{ matrix.target }}
          path: packages/cli/sb-${{ matrix.target }}.*

  release:
    name: GitHub Release + npm publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload binaries
      id-token: write   # OIDC for npm publish provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to a Trusted-Publishing-capable version
        run: npm install -g npm@latest

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Install workspace deps
        run: npm ci

      - name: Publish (Trusted Publishing + provenance)
        working-directory: packages/cli
        run: npm publish --provenance --access public
