name: Release Python SDK

# Publishes `stablebaseline` to PyPI on tags of the form sdk-py-vX.Y.Z.
# Uses PyPI Trusted Publishing (OIDC) — no token secret needed; configure
# the `pypi` environment in repo settings to allow this workflow.
#
# Actions pinned by commit SHA.

on:
  push:
    tags:
      - "sdk-py-v*"
  workflow_dispatch:
    inputs:
      version:
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/stablebaseline
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Refresh OpenAPI spec
        run: |
          python -m pip install httpx
          mkdir -p packages/sdk-python
          curl -sL "https://api.stablebaseline.io/functions/v1/cloud-serve/api/v1/openapi.json" -o packages/sdk-python/openapi.json

      - name: Build sdist + wheel
        working-directory: packages/sdk-python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/sdk-python/dist
