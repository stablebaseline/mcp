name: Release TypeScript SDK

# Publishes @stablebaseline/sdk on tags of the form sdk-ts-vX.Y.Z.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Configure once at https://www.npmjs.com/package/@stablebaseline/sdk/access
# (Trusted Publishers tab) binding this workflow to the package.

on:
  push:
    tags:
      - "sdk-ts-v*"
  workflow_dispatch:
    inputs:
      version:
        required: true

permissions:
  contents: read
  id-token: write   # required for npm + Sigstore provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to a Trusted-Publishing-capable version
        run: npm install -g npm@latest

      - run: npm ci

      - name: Refresh OpenAPI spec from production
        run: npm run codegen:openapi

      - name: Generate types
        working-directory: packages/sdk-typescript
        run: npm run codegen

      - name: Build
        working-directory: packages/sdk-typescript
        run: npm run build

      - name: Publish (Trusted Publishing + provenance)
        working-directory: packages/sdk-typescript
        run: npm publish --provenance --access public
