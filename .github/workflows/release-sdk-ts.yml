name: Release TypeScript SDK

# Publishes @stablebaseline/sdk on tags of the form sdk-ts-vX.Y.Z.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Configure once at https://www.npmjs.com/package/@stablebaseline/sdk/access
# (Trusted Publishers tab) binding this workflow to the package.
#
# Actions are pinned by commit SHA (with a comment for the human-readable
# tag) so that an upstream re-tagging cannot silently change what runs in CI.

on:
  push:
    tags:
      - "sdk-ts-v*"
  workflow_dispatch:
    inputs:
      version:
        required: true

# Default to least privilege — id-token enabled only for the publish job.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm + Sigstore provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to a Trusted-Publishing-capable version
        run: npm install -g npm@latest

      - run: npm ci

      - name: Refresh OpenAPI spec from production
        run: npm run codegen:openapi

      - name: Generate types
        working-directory: packages/sdk-typescript
        run: npm run codegen

      - name: Build
        working-directory: packages/sdk-typescript
        run: npm run build

      - name: Publish (Trusted Publishing + provenance)
        working-directory: packages/sdk-typescript
        run: npm publish --provenance --access public
