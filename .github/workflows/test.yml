name: Test

# Runs the test suite for all 3 packages on every push and PR.
# Mock-based tests run fast and unconditionally; live API integration
# tests are NOT in this workflow — they live in clouddocs and run
# against production after every cloud-serve deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sdk-typescript:
    name: SDK TS (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh OpenAPI spec from production
        run: npm run codegen:openapi
      - name: Generate types
        working-directory: packages/sdk-typescript
        run: npm run codegen
      - name: Build
        working-directory: packages/sdk-typescript
        run: npm run build
      - name: Test
        working-directory: packages/sdk-typescript
        run: npm test

  test-cli:
    name: CLI (vitest)
    runs-on: ubuntu-latest
    needs: test-sdk-typescript
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh OpenAPI spec from production
        run: npm run codegen:openapi
      - name: Generate SDK types (CLI depends on SDK)
        working-directory: packages/sdk-typescript
        run: npm run codegen
      - name: Build SDK
        working-directory: packages/sdk-typescript
        run: npm run build
      - name: Test CLI
        working-directory: packages/cli
        run: npm test

  test-sdk-python:
    name: SDK Python (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        working-directory: packages/sdk-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Refresh OpenAPI spec from production
        run: |
          curl -sL "https://api.stablebaseline.io/functions/v1/cloud-serve/api/v1/openapi.json" \
            -o packages/sdk-python/openapi.json
      - name: Test
        working-directory: packages/sdk-python
        run: python -m pytest tests/ -v

  surface-checks:
    name: Surface consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0   # need tags for version-vs-tag comparison
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh OpenAPI from production (gitignored, needed by check)
        run: npm run codegen:openapi
      - name: Run check:surfaces
        run: npm run check:surfaces
