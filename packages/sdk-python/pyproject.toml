# hatchling is capped below 1.30: 1.30.0 emits `Metadata-Version: 2.5`, which
# neither twine (6.2) nor packaging (26.2) nor PyPI accept yet ("not a valid
# metadata version"), so the publish step rejects the wheel. `python -m build`
# resolves the backend from THIS list (the isolated build env), not from any
# `pip install hatchling` in CI, so the cap must live here. Lift it once the
# upload toolchain recognises 2.5.
[build-system]
requires = ["hatchling<1.30"]
build-backend = "hatchling.build"

[project]
name = "stablebaseline"
version = "0.6.1"
description = "Python SDK for the Stable Baseline REST API. End-to-end agent-managed company brain — docs, diagrams, plans, and a self-learning Knowledge Graph. 184 tools across 19 categories."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Stable Baseline", email = "hello@stablebaseline.io" }]
keywords = [
  "stablebaseline",
  "stable-baseline",
  "mcp",
  "model-context-protocol",
  "knowledge-graph",
  "company-brain",
  "documentation",
  "diagrams",
  "plans",
  "ai-agent",
  "rest-api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "typing-extensions>=4.10.0; python_version < '3.12'",
]

[project.urls]
Homepage = "https://stablebaseline.io"
Documentation = "https://stablebaseline.io/docs/mcp"
Repository = "https://github.com/stablebaseline/mcp"
Issues = "https://github.com/stablebaseline/mcp/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["stablebaseline"]

[tool.hatch.build.targets.sdist]
include = ["stablebaseline", "README.md", "LICENSE", "openapi.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
